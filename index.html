<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper | Links</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- CARROSSEL 3D GIRATÓRIO -->
        <div class="scene">
            <div class="carousel">
                <!-- Substitua os 'src' pelas suas imagens reais na pasta assets/images/ -->
                <div class="carousel__cell"><img src="assets/images/perfil-1.jpg" alt="Perfil 1"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-2.jpg" alt="Perfil 2"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-3.jpg" alt="Perfil 3"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-4.jpg" alt="Perfil 4"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-5.jpg" alt="Perfil 5"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-6.jpg" alt="Perfil 6"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-7.jpg" alt="Perfil 7"></div>
                <div class="carousel__cell"><img src="assets/images/perfil-8.jpg" alt="Perfil 8"></div>

                <!-- NOME NO CENTRO -->
                <div class="center-name">PAPER</div>
            </div>
        </div>

        <!-- DESCRIÇÃO -->
        <div class="description">
            <h2>Estudante de Ciências Econômicas</h2>
            <p>Marxista. Anti-imperialista. Construindo conhecimento crítico sobre a realidade material e as lutas de classe.</p>
        </div>

        <!-- LINKS ESTILO LINKTREE -->
        <div class="links">
            <a href="https://github.com/lastpaper" class="link-btn" target="_blank">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://twitter.com/seu_usuario" class="link-btn" target="_blank">
                <i class="fab fa-twitter"></i> Twitter / X
            </a>
            <a href="https://t.me/seu_usuario" class="link-btn" target="_blank">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <a href="mailto:seu@email.com" class="link-btn">
                <i class="fas fa-envelope"></i> E-mail
            </a>
        </div>

        <footer>
            <p>© 2026 Paper</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
