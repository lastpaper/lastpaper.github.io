<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header/Nav -->
    <header class="header">
        <nav class="navbar">
            <div class="logo"> SeuLogo</div>
            <ul class="nav-links">

                <li><a href="#conteudos">Conteúdos</a></li>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Conheça a si.<br>Entenda o outro.<br>Transforme o mundo.</h1>

            <div class="topic-card">

            <!-- Repita para mais cards -->
